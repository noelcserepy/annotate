[package]
name = "annotate"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Screenshot, add callouts, paste. A tray app for macOS and Windows."
license = "MIT"
repository = "https://github.com/noelcserepy/annotate"
publish = false

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
cosmic-text = "0.19"
tiny-skia = "0.12"
tray-icon = "0.26"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
auto-launch = "0.6"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
resvg = { version = "0.45", default-features = false }
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSScreen", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
